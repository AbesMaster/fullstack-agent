name: FELICIA OS CI

on:
  push:
    paths: ["felicia-os/**", ".github/workflows/felicia-os.yml"]
  pull_request:
    paths: ["felicia-os/**", ".github/workflows/felicia-os.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.55 does not support ubuntu-26.04 (the new ubuntu-latest)
    defaults:
      run:
        working-directory: felicia-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: felicia-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: felicia-os/test-results
